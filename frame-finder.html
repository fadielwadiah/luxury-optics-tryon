<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Your Frame</title>
<style>
:root{--bg:#F4EFE8;--ink:#111;--muted:#6b645a;--gold:#B89554;--card:#fff;--line:#DACDA9;--soft:#efe7da}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 36px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(26px,4vw,38px);margin:0 0 6px;letter-spacing:.01em}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:21px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.55;max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.stage{position:relative;background:#e8e0d3;border:1px solid var(--line);aspect-ratio:4/3;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas#cv{width:100%;height:100%;object-fit:contain;display:block}
.hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--muted);font-size:15px;line-height:1.55}
.hint b{font-family:Georgia,serif;font-weight:400;font-size:22px;color:var(--ink)}
.badge{position:absolute;bottom:10px;inset-inline:10px;background:rgba(17,17,17,.8);color:#fff;font-size:13px;padding:7px 10px;text-align:center}
.bar{height:4px;background:rgba(255,255,255,.25);margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .15s}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
button,.btn{font:inherit;font-size:14px;letter-spacing:.04em;padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:transparent;color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}
.btn.sm{padding:8px 12px;font-size:12.5px}
button:focus-visible,.btn:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.priv{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);padding:16px;margin:0 0 16px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.res-name{font-family:Georgia,serif;font-size:28px;line-height:1.15;margin:0 0 6px}
.res-desc{color:var(--muted);font-size:14.5px;line-height:1.6;margin:0 0 10px}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin:10px 0}
.meter i{display:block;height:6px;background:var(--soft);position:relative}.meter i b{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{font:inherit;font-size:12.5px;letter-spacing:0;padding:6px 10px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.small{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:520px){.tile span{font-size:10.5px}}
.tile{position:relative;background:var(--card);border:1px solid var(--line);padding:8px 4px 8px;cursor:pointer;text-align:center;font:inherit;color:inherit;letter-spacing:0}
.tile[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.tile canvas{width:100%;height:44px;display:block}
.tile span{display:block;font-size:11.5px;margin-top:4px;line-height:1.25}
.star{position:absolute;top:2px;inset-inline-start:4px;color:var(--gold);font-size:13px;line-height:1}
.dot{position:absolute;top:5px;inset-inline-end:5px;width:7px;height:7px;border-radius:50%;background:#2f7d4f}
.dot.no{background:#c7bfb0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0}.legend span{display:inline-flex;gap:5px;align-items:center}
.legend .star{position:static}.legend .dot{position:static}
.colors{display:flex;gap:8px;margin:12px 0 0;align-items:center;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.avail{margin-top:6px}
.avail-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:860px){.prods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pc{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;text-decoration:none;color:inherit}
.pc img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;display:block}
.pc div{padding:8px 10px 10px;border-top:1px solid var(--line)}
.pc small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.pc b{font-family:Georgia,serif;font-weight:400;font-size:16px}
.pc em{display:block;font-style:normal;color:var(--gold);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.notice{background:var(--card);border:1px dashed var(--gold);padding:16px;line-height:1.6}
.notice p{margin:0 0 12px}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.disc{font-size:12px;color:var(--muted);margin:22px 0 0;line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
[hidden]{display:none!important}
</style></head>

  <h1 id="t_title"></h1>
  <p class="sub" id="t_sub"></p>
  <div class="grid">
    <div>
      <div class="stage" id="stage">
        <canvas id="cv" width="960" height="720"></canvas>

    <div>
      <div class="card" id="resCard" hidden>

        <p class="small" id="t_notRight"></p>
        <div class="chips" id="faceChips"></div>
      </div>
      <div class="card" id="shapeCard">
        <h2 id="t_pick"></h2>
        <div class="shapes" id="shapes"></div>
        <div class="legend"><span><i class="star">★</i><span id="lg1"></span></span><span><i class="dot"></i><span id="lg2"></span></span><span><i class="dot no"></i><span id="lg3"></span></span></div>
        <div class="colors" id="colors"><span class="small" id="t_color" style="margin:0"></span></div>
        <p class="small" id="shapeDesc" style="color:var(--ink);font-size:13px"></p>
      </div>
    </div>
  </div>
  <div class="avail card" id="avail" hidden></div>
  <p class="disc" id="t_disc"></p>
</div>

 c.translate(W/2,H/2);c.scale(k,k);drawFrame(c,shape,'black',{icon:true});
}

// ---------- state ----------
let curShape='aviator',curColor='black',curLens='std',face=null,faceKey=null,mode='none'; // mode: none|live|photo

const cv=$('cv'),ctx=cv.getContext('2d'),vid=$('vid'),hint=$('hint'),badge=$('badge');
function showHint(h,p,spin){hint.hidden=false;hint.innerHTML='';if(spin){const s=document.createElement('div');s.className='spin';hint.appendChild(s)}if(h){const b=document.createElement('b');b.textContent=h;hint.appendChild(b)}if(p){const s=document.createElement('div');s.textContent=p;hint.appendChild(s)}}
function setBadge(t,prog){if(!t){badge.hidden=true;return}badge.hidden=false;$('badgeT').textContent=t;$('bar').hidden=prog==null;if(prog!=null)$('barI').style.width=Math.round(prog*100)+'%'}

// ---------- shapes UI ----------
function buildShapes(){

 }
}
function buildColors(){
 const box=$('colors');[...box.querySelectorAll('.sw')].forEach(n=>n.remove());
 const bg={black:'#121212',tortoise:'linear-gradient(135deg,#4a2410,#8a5527 45%,#3b1c0b)',gold:'#C9A24D'};
 for(const k of ['black','tortoise','gold']){const b=document.createElement('button');b.className='sw';b.type='button';b.style.background=bg[k];b.title=TX[k];b.setAttribute('aria-label',TX[k]);b.setAttribute('aria-pressed',String(k===curColor));b.onclick=()=>{curColor=k;buildColors();redraw()};box.appendChild(b)}
}
function buildFaceChips(){

}
function setFace(f,manual){
 faceKey=f;const F=FACE[f];
 $('resCard').hidden=false;$('resName').textContent=F[lang];$('resDesc').textContent=F['d_'+lang]+' '+F['w_'+lang];
 buildFaceChips();
 if(!manual||!curShape||!F.rec.includes(curShape))curShape=F.rec.find(s=>count(s))||F.rec[0];

}
function renderMeter(m){
 const box=$('meter');box.innerHTML='';
 if(!m)return;
 const row=(label,v,lo,hi)=>{const a=document.createElement('span');a.textContent=label;const i=document.createElement('i');const b=document.createElement('b');b.style.width=Math.round(Math.max(.04,Math.min(1,(v-lo)/(hi-lo)))*100)+'%';i.appendChild(b);const n=document.createElement('span');n.textContent=v.toFixed(2);box.append(a,i,n)};
 row(TX.meterLen,m.r,1.0,1.4);row(TX.meterFore,m.fj,.7,1.05);row(TX.meterJaw,m.jw,.7,1.05);
}

function renderAvail(){

  const d=document.createElement('div');const s=document.createElement('small');s.textContent=p.brand;const b=document.createElement('b');b.textContent=p.name;const e=document.createElement('em');e.textContent=TX.view;
  d.append(s,b,e);a.append(im,d);g.appendChild(a);
 }
 box.appendChild(g);

}

// ---------- face tracker ----------
async function getLmk(){
 if(lmk)return lmk;if(loadingLmk)return loadingLmk;
 loadingLmk=(async()=>{
  const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const M=await import(base+'/vision_bundle.mjs');
  const fs=await M.FilesetResolver.forVisionTasks(base+'/wasm');
  const model='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
  const mk=d=>M.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:d},runningMode:'IMAGE',numFaces:1});
  try{lmk=await mk('GPU')}catch(e){lmk=await mk('CPU')}
  return lmk;
 })();
 return loadingLmk;
}
let curMode='IMAGE';
async function setMode(m){const L=await getLmk();if(curMode!==m){await L.setOptions({runningMode:m});curMode=m}return L}

// metrics from 478 landmarks (normalised coords); distances in pixels of a W x H frame
function metrics(l,W,H){
 const P=i=>({x:l[i].x*W,y:l[i].y*H}),D=(a,b)=>Math.hypot(P(a).x-P(b).x,P(a).y-P(b).y);
 const cheek=D(234,454),fore=D(54,284),jaw=D(58,288),len=D(10,152);
 const nL=D(1,234),nR=D(1,454),asym=Math.abs(nL-nR)/(nL+nR); // turned-head proxy
 const e1=P(33),e2=P(263);let roll=Math.atan2(e2.y-e1.y,e2.x-e1.x);if(Math.abs(roll)>Math.PI/2)roll+=Math.PI;
 return {r:len/cheek,fj:fore/cheek,jw:jaw/cheek,asym,roll:Math.abs(roll*180/Math.PI),cheek};
}
function classify(m){
 const g=(v,mu,sd)=>Math.exp(-.5*((v-mu)/sd)**2);
 const S={
  oval:   g(m.r,1.19,.06)*g(m.jw,.86,.07)*g(m.fj,.88,.07),
  round:  g(m.r,1.08,.05)*g(m.jw,.90,.07)*g(m.fj,.89,.07),
  square: g(m.r,1.12,.07)*g(m.jw,.95,.05)*g(m.fj,.94,.06),
  heart:  g(m.r,1.20,.09)*g(m.jw,.76,.06)*g(m.fj,.94,.06),
  oblong: g(m.r,1.38,.07)*g(m.jw,.88,.09)*g(m.fj,.90,.09),
  diamond:g(m.r,1.22,.08)*g(m.jw,.78,.06)*g(m.fj,.78,.06)
 };
 let best='oval';for(const k in S)if(S[k]>S[best])best=k;
 return best;
}
function median(a){const b=a.slice().sort((x,y)=>x-y);return b[Math.floor(b.length/2)]}
function aggregate(ss){return {r:median(ss.map(s=>s.r)),fj:median(ss.map(s=>s.fj)),jw:median(ss.map(s=>s.jw)),asym:median(ss.map(s=>s.asym)),roll:median(ss.map(s=>s.roll))}}

// ---------- overlay ----------
const KEY=()=>curColor;
function overlay(c,l,W,H,mir){
 const P=i=>({x:(mir?1-l[i].x:l[i].x)*W,y:l[i].y*H});
 const hasIris=l.length>473;
 const a=hasIris?P(468):{x:(P(33).x+P(133).x)/2,y:(P(33).y+P(133).y)/2};
 const b=hasIris?P(473):{x:(P(362).x+P(263).x)/2,y:(P(362).y+P(263).y)/2};
 const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
 let roll=Math.atan2(b.y-a.y,b.x-a.x);if(Math.abs(roll)>Math.PI/2)roll+=Math.PI;
 const e=P(234),g=P(454),n=P(1);
 const faceW=Math.hypot(g.x-e.x,g.y-e.y),k=.5*(Math.hypot(b.x-a.x,b.y-a.y)/63+faceW/150);
 const dl=Math.hypot(n.x-e.x,n.y-e.y),dr=Math.hypot(g.x-n.x,g.y-n.y);
 const r=Math.max(-1,Math.min(1,(dl-dr)/(dl+dr)*1.5)),sx=Math.max(.55,Math.cos(Math.asin(r)));
 c.save();c.translate(mid.x,mid.y);c.rotate(roll);c.scale(sx*k,k);c.translate(0,1.5);
 drawFrame(c,curShape,KEY(),{});
 c.restore();
}
function redraw(){
 if(mode==='photo'&&still){
  ctx.drawImage(still,0,0,cv.width,cv.height);
  if(stillLm)overlay(ctx,stillLm,cv.width,cv.height,false);
 }
}

// ---------- camera (live) ----------
async function startCamera(){
 stopAll();showHint('',TX.loading,true);
 try{
  try{await setMode('VIDEO')}catch(e){console.warn(e);lmk=null;loadingLmk=null;showHint(TX.h1,TX.loadfail);stopAll(true);return}
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
  vid.srcObject=stream;await vid.play();
 }catch(e){console.warn(e);showHint(TX.h1,TX.camfail);stopAll(true);return}
 mode='live';samples=[];hint.hidden=true;$('bStop').hidden=false;$('bCam').hidden=true;
 cv.width=vid.videoWidth||960;cv.height=vid.videoHeight||720;
 let last=-1;
 const loop=()=>{
  if(mode!=='live')return;
  raf=requestAnimationFrame(loop);
  if(vid.currentTime===last)return;last=vid.currentTime;
  ctx.save();ctx.translate(cv.width,0);ctx.scale(-1,1);ctx.drawImage(vid,0,0,cv.width,cv.height);ctx.restore();
  let res=null;try{res=lmk.detectForVideo(vid,performance.now())}catch(e){}
  const l=res&&res.faceLandmarks&&res.faceLandmarks[0];
  if(!l){setBadge(TX.noface);return}
  if(!faceKey||samples.length<22){
   const m=metrics(l,cv.width,cv.height);
   if(m.asym<.09&&m.roll<12){samples.push(m)}
   if(!faceKey){setBadge(samples.length<22?TX.hold:'',samples.length/22);if(samples.length>=22){const ag=aggregate(samples);face=ag;renderMeter(ag);setFace(classify(ag),false);setBadge('')}}
  }else setBadge('');
  overlay(ctx,l,cv.width,cv.height,true);
 };
 loop();
}
function stopAll(keepHint){
 mode=mode==='photo'?'photo':'none';cancelAnimationFrame(raf);
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 vid.srcObject=null;$('bStop').hidden=true;$('bCam').hidden=false;setBadge('');
 if(!keepHint&&mode==='none')showHint(TX.h1,TX.h2);
}
$('bCam').onclick=()=>{faceKey=null;face=null;$('resCard').hidden=true;mode='none';startCamera()};
$('bStop').onclick=()=>{mode='none';stopAll()};

// ---------- photo ----------
$('bPhoto').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;e.target.value='';
 mode='none';stopAll(true);showHint('',TX.loading,true);
 try{
  const url=URL.createObjectURL(f);
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const sc=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight));
  const W=Math.round(im.naturalWidth*sc),H=Math.round(im.naturalHeight*sc);
  const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);URL.revokeObjectURL(url);
  let L;try{L=await setMode('IMAGE')}catch(e){console.warn(e);lmk=null;loadingLmk=null;showHint(TX.h1,TX.loadfail);return}
  const res=L.detect(c);const l=res.faceLandmarks&&res.faceLandmarks[0];
  if(!l){showHint(TX.h1,TX.noface);return}
  still=c;stillLm=l;cv.width=W;cv.height=H;mode='photo';hint.hidden=true;
  const m=metrics(l,W,H);face=m;renderMeter(m);
  setFace(classify(m),false);
  if(m.asym>.12||m.roll>14)setBadge(TX.turned);else setBadge('');
 }catch(err){console.warn(err);showHint(TX.h1,TX.noface)}
};

buildShapes();buildColors();
renderAvail();
window.__ff={classify,metrics,setFace,get shape(){return curShape},set shape(v){curShape=v;buildShapes();renderAvail();redraw()},set color(v){curColor=v;buildColors();redraw()},byShape,getLmk,setStill(c,l){still=c;stillLm=l;cv.width=c.width;cv.height=c.height;mode='photo';hint.hidden=true;const m=metrics(l,c.width,c.height);face=m;renderMeter(m);setFace(classify(m),false);return m}};
</script>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Try-On</title>
<style>
:root{--bg:#F4EFE8;--ink:#111;--muted:#6b645a;--gold:#B89554;--card:#fff;--line:#DACDA9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 28px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(26px,4vw,38px);margin:0 0 6px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px;line-height:1.5}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.stage{position:relative;background:#e8e0d3;border:1px solid var(--line);aspect-ratio:4/3;overflow:hidden;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;object-fit:contain;display:block}
.hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--muted);font-size:15px;line-height:1.5}
.hint b{font-family:Georgia,serif;font-weight:400;font-size:22px;color:var(--ink)}
.badge{position:absolute;bottom:10px;inset-inline:10px;background:rgba(17,17,17,.78);color:#fff;font-size:13px;padding:6px 10px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0}
button,.btn{font:inherit;font-size:14px;letter-spacing:.04em;padding:12px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:transparent;color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#111}
button:focus-visible,.btn:focus-visible,.item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.priv{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.5}
.panel h2{font-family:Georgia,serif;font-weight:400;font-size:20px;margin:0 0 12px}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.item{background:var(--card);border:1px solid var(--line);padding:6px 6px 8px;cursor:pointer;text-align:center;font:inherit;color:inherit;letter-spacing:0}
.item[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.item canvas{height:54px;width:100%;object-fit:contain}
.item span{display:block;font-size:11.5px;margin-top:4px;line-height:1.3}
.item small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.now{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.now .nm{font-family:Georgia,serif;font-size:20px}
.now .br{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
</style></head>
<body>
<div class="wrap" id="app">
  <h1 id="t_title"></h1>
  <p class="sub" id="t_sub"></p>
  <div class="grid">
    <div>
      <div class="stage" id="stage">
        <canvas id="cv" width="960" height="720"></canvas>
        <div class="hint" id="hint"></div>
        <div class="badge" id="badge" hidden></div>
      </div>
      <div class="row">

        <button class="ghost" id="bPhoto"></button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <p class="priv" id="t_priv"></p>
    </div>
    <div class="panel">
      <h2 id="t_pick"></h2>
      <div class="list" id="list"></div>
      <div class="now" id="now">
        <div class="br" id="nowBrand"></div>
        <div class="nm" id="nowName"></div>
        <div class="row">
          <a class="btn gold" id="aWa" target="_blank" rel="noopener"></a>
          <a class="btn ghost" id="aView" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </div>
</div>

const T={
 en:{title:'Try them on',sub:'Pick a frame and see it on your own face, live.',cam:'Start camera',photo:'Use a photo',priv:'Your camera stays on your device. Nothing is recorded or uploaded.',pick:'Our frames',

function showHint(h,p){hint.hidden=false;hint.innerHTML='';if(h){const b=document.createElement('b');b.textContent=h;hint.appendChild(b)}if(p){const s=document.createElement('div');s.textContent=p;hint.appendChild(s)}}

// ---- cut the white background out of a product photo ----
function load(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function prep(f){
  if(f.ready)return f.ready;
  f.ready=(async()=>{
    if(f.url){const pim=await load(f.url);const pc=document.createElement('canvas');pc.width=pim.naturalWidth;pc.height=pim.naturalHeight;pc.getContext('2d').drawImage(pim,0,0);f.cv=pc;if(f.side){const sim=await load(f.side);const sc=document.createElement('canvas');sc.width=sim.naturalWidth;sc.height=sim.naturalHeight;sc.getContext('2d').drawImage(sim,0,0);f.sv=sc}return pc}
    const im=await load(IMG+f.file+'.webp');
    const w=im.naturalWidth,h=im.naturalHeight,c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);
    const d=x.getImageData(0,0,w,h),p=d.data;let x0=w,y0=h,x1=0,y1=0;
    for(let i=0;i<p.length;i+=4){
      const m=Math.min(p[i],p[i+1],p[i+2]);let a;
      if(m>=236)a=0;else if(m<=186)a=255;else a=(236-m)/50*255;
      if(a>0&&a<255){const k=255*(1-a/255)/(a/255);for(let j=0;j<3;j++){p[i+j]=Math.max(0,Math.min(255,(p[i+j]-255*(1-a/255))/(a/255)))}}
      p[i+3]=a;
      if(a>40){const q=i/4,px=q%w,py=(q/w)|0;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
    }
    x.putImageData(d,0,0);
    const bw=x1-x0+1,bh=y1-y0+1,o=document.createElement('canvas');o.width=bw;o.height=bh;
    o.getContext('2d').drawImage(c,x0,y0,bw,bh,0,0,bw,bh);
    f.cv=o;return o;
  })();
  return f.ready;
}

// ---- list ----
let cur=0;const listEl=$('list');
FR.forEach((f,i)=>{
  const b=document.createElement('button');b.className='item';b.type='button';b.setAttribute('aria-pressed',i===0);
  const c=document.createElement('canvas');c.width=160;c.height=80;b.appendChild(c);

  b.onclick=()=>select(i);listEl.appendChild(b);f.btn=b;f.thumb=c;
  prep(f).then(o=>{const g=c.getContext('2d');const r=Math.min(160/o.width,80/o.height);const w=o.width*r,h=o.height*r;g.drawImage(o,(160-w)/2,(80-h)/2,w,h);if(i===cur)redraw()}).catch(()=>{c.style.opacity=.2});
});
function select(i){

select(0);

// ---- face tracking ----
let lmk=null,loading=null,mode='none',stream=null,video=null,lastFace=null,raf=0,photoImg=null;
async function tracker(){
  if(lmk)return lmk;
  if(loading)return loading;
  loading=(async()=>{
    const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const M=await import(base+'/vision_bundle.mjs');
    const fs=await M.FilesetResolver.forVisionTasks(base+'/wasm');
    const model='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    try{lmk=await M.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:'GPU'},runningMode:'IMAGE',numFaces:1})}
    catch(e){lmk=await M.FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:model,delegate:'CPU'},runningMode:'IMAGE',numFaces:1})}
    return lmk;
  })();
  return loading;
}
// Head pose from face-mesh landmarks (rigid fit to canonical face), in display space.
// Output frame: X right, Y up, Z toward viewer. Units: pixels.
const CAN={"33":[-4.446,2.664,3.173],"133":[-1.856,2.585,3.758],"362":[1.856,2.585,3.758],"263":[4.446,2.664,3.173],"168":[0,3.271,5.236],"6":[0,2.473,5.789],"1":[0,-1.127,7.476],"4":[0,-0.463,7.587],"234":[-7.664,0.673,-2.436],"454":[7.664,0.673,-2.436],"152":[0,-9.403,4.264],"10":[0,8.262,4.482],"61":[-2.456,-4.343,4.284],"291":[2.456,-4.343,4.284],"129":[-1.786,-0.978,4.85],"358":[1.786,-0.978,4.85],"205":[-3.833,-1.537,4.138],"425":[3.833,-1.537,4.138],"127":[-7.743,2.365,-2.005],"356":[7.743,2.365,-2.005]};
const IDS=Object.keys(CAN).map(Number);
function inv3(m){const[a,b,c,d,e,f,g,h,i]=m;const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g;const det=a*A+b*B+c*C;if(Math.abs(det)<1e-12)return null;const k=1/det;
 return[A*k,-(b*i-c*h)*k,(b*f-c*e)*k,B*k,(a*i-c*g)*k,-(a*f-c*d)*k,C*k,-(a*h-b*g)*k,(a*e-b*d)*k]}
function tr3(m){return[m[0],m[3],m[6],m[1],m[4],m[7],m[2],m[5],m[8]]}
function polar(M){let R=M.slice();for(let k=0;k<30;k++){const iv=inv3(R);if(!iv)return null;const it=tr3(iv);const N=R.map((v,i)=>.5*(v+it[i]));let dlt=0;for(let i=0;i<9;i++)dlt+=Math.abs(N[i]-R[i]);R=N;if(dlt<1e-9)break}return R}
// l: landmarks (normalized), W,H: canvas size, mir: display is mirrored
function fitPose(l,W,H,mir){
  const Q=[],P=[];
  for(const i of IDS){const c=CAN[i];Q.push([mir?-c[0]:c[0],c[1],c[2]]);const p=l[i];P.push([(mir?1-p.x:p.x)*W,-p.y*H,-p.z*W])}
  const n=IDS.length;const mq=[0,0,0],mp=[0,0,0];
  for(let i=0;i<n;i++)for(let k=0;k<3;k++){mq[k]+=Q[i][k]/n;mp[k]+=P[i][k]/n}
  const M=new Array(9).fill(0);let qq=0;
  for(let i=0;i<n;i++){const q=[Q[i][0]-mq[0],Q[i][1]-mq[1],Q[i][2]-mq[2]],p=[P[i][0]-mp[0],P[i][1]-mp[1],P[i][2]-mp[2]];
    for(let r=0;r<3;r++)for(let c=0;c<3;c++)M[r*3+c]+=p[r]*q[c];qq+=q[0]*q[0]+q[1]*q[1]+q[2]*q[2]}
  const R=polar(M);if(!R)return null;
  if(R[0]*(R[4]*R[8]-R[5]*R[7])-R[1]*(R[3]*R[8]-R[5]*R[6])+R[2]*(R[3]*R[7]-R[4]*R[6])<0)return null;
  let s=0;for(let r=0;r<3;r++)for(let c=0;c<3;c++)s+=R[r*3+c]*M[r*3+c];s/=qq;
  // translation: p = s R q + t
  const t=[0,0,0];for(let r=0;r<3;r++)t[r]=mp[r]-s*(R[r*3]*mq[0]+R[r*3+1]*mq[1]+R[r*3+2]*mq[2]);
  return {R,s,t};
}
function toEuler(R){ // yaw about Y, pitch about X, roll about Z (degrees) – for logging
  const yaw=Math.atan2(R[2],R[8]),pitch=Math.asin(-Math.max(-1,Math.min(1,R[5]))),roll=Math.atan2(R[3],R[4]);
  return [yaw,pitch,roll].map(v=>+(v*180/Math.PI).toFixed(1));
}

function pose2d(l,W,H,mir){
  const P=i=>({x:(mir?1-l[i].x:l[i].x)*W,y:l[i].y*H});
  const a=P(33),b=P(263),e=P(234),g=P(454),n=P(1);
  const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  const fw=Math.hypot(g.x-e.x,g.y-e.y);
  let roll=Math.atan2(b.y-a.y,b.x-a.x);if(Math.abs(roll)>Math.PI/2)roll+=Math.PI;
  const dl=Math.hypot(n.x-e.x,n.y-e.y),dr=Math.hypot(g.x-n.x,g.y-n.y);
  const r=Math.max(-1,Math.min(1,(dl-dr)/(dl+dr)*1.5));
  const sx=Math.max(.6,Math.cos(Math.asin(r)));
  return {cx,cy,w:fw,roll,sx};
}
function pose(l,W,H,mir){let f=null;try{f=fitPose(l,W,H,mir)}catch(e){}return {f,p2:pose2d(l,W,H,mir)}}
function m2q(R){const t=R[0]+R[4]+R[8];let x,y,z,w;
  if(t>0){const s=Math.sqrt(t+1)*2;w=s/4;x=(R[7]-R[5])/s;y=(R[2]-R[6])/s;z=(R[3]-R[1])/s}
  else if(R[0]>R[4]&&R[0]>R[8]){const s=Math.sqrt(1+R[0]-R[4]-R[8])*2;w=(R[7]-R[5])/s;x=s/4;y=(R[1]+R[3])/s;z=(R[2]+R[6])/s}
  else if(R[4]>R[8]){const s=Math.sqrt(1+R[4]-R[0]-R[8])*2;w=(R[2]-R[6])/s;x=(R[1]+R[3])/s;y=s/4;z=(R[5]+R[7])/s}
  else{const s=Math.sqrt(1+R[8]-R[0]-R[4])*2;w=(R[3]-R[1])/s;x=(R[2]+R[6])/s;y=(R[5]+R[7])/s;z=s/4}
  return [x,y,z,w]}
function slerp(a,b,k){let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];const bb=b.slice();if(d<0){d=-d;for(let i=0;i<4;i++)bb[i]=-bb[i]}
  const o=a.map((v,i)=>v+(bb[i]-v)*k);const n=Math.hypot(...o)||1;return o.map(v=>v/n)}
let sm=null;
function smooth(p){
  const q=p.f?m2q(p.f.R):null;
  if(!sm){sm={p2:{...p.p2},f:p.f?{q,s:p.f.s,t:p.f.t.slice()}:null};return sm}
  const k=.5;
  for(const z in p.p2)sm.p2[z]+=(p.p2[z]-sm.p2[z])*k;
  if(p.f){if(!sm.f)sm.f={q,s:p.f.s,t:p.f.t.slice()};else{sm.f.q=slerp(sm.f.q,q,k);sm.f.s+=(p.f.s-sm.f.s)*k;for(let i=0;i<3;i++)sm.f.t[i]+=(p.f.t[i]-sm.f.t[i])*k}}
  return sm;
}

// ---- 3D glasses (units = canonical face centimetres) ----
let THREE=null,glr=null,scene=null,cam=null,root=null,rig=null,rigFor=null;
const FACE_W=15.33,WG=FACE_W*1.0,GY=2.3,GZ=6.0,BEND=.012,TUCK=2.4;
async function loadThree(){
  if(THREE)return THREE;
  try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js')}catch(e){console.log('THREEFAIL',e&&e.message);THREE=null}
  return THREE;
}
function texOf(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;t.needsUpdate=true;return t}
function buildRig(f){
  if(rig){root.remove(rig);rig.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}})}
  rig=new THREE.Group();rigFor=f;
  const g=new THREE.Group();g.position.set(0,GY,GZ);rig.add(g);
  const mat=c=>new THREE.MeshBasicMaterial({map:texOf(c),transparent:true,alphaTest:.02,side:THREE.DoubleSide});
  const fh=WG*f.cv.height/f.cv.width;
  const fg=new THREE.PlaneGeometry(WG,fh,24,1);const pa=fg.attributes.position;
  for(let i=0;i<pa.count;i++){const x=pa.getX(i);pa.setZ(i,-BEND*x*x)}
  fg.computeBoundingSphere();
  const front=new THREE.Mesh(fg,mat(f.cv));front.renderOrder=3;g.add(front);
  if(f.sv){
    const aw=WG*f.sv.width/f.cv.width,ah=WG*f.sv.height/f.cv.width;
    const am=mat(f.sv);
    for(const sx of [1,-1]){
      // the arm tucks inward toward the head over its last part, so its tip goes in behind the ear
      const ag=new THREE.PlaneGeometry(aw,ah,60,1);const ap=ag.attributes.position;
      for(let i=0;i<ap.count;i++){const u=(ap.getX(i)+aw/2)/aw;let t=Math.max(0,Math.min(1,(u-.74)/.26));t=t*t*(3-2*t);ap.setZ(i,-sx*TUCK*t)}
      const a=new THREE.Mesh(ag,am);a.rotation.y=Math.PI/2;
      a.position.set(sx*(WG/2-.3),fh/2-ah/2,-.25-aw/2);a.renderOrder=2;g.add(a);
    }
  }
  root.add(rig);
  // head occluder: hides the far arm behind the head
  if(!root.userData.occ){
    const o=new THREE.Mesh(new THREE.SphereGeometry(1,40,28),new THREE.MeshBasicMaterial({colorWrite:false}));
    o.scale.set(7.1,10.6,8.6);o.position.set(0,.6,-3.0);o.renderOrder=-10;root.add(o);root.userData.occ=o;
  }
}
function ensureGL(w,h){
  if(!glr){
    glr=new THREE.WebGLRenderer({alpha:true,antialias:true,premultipliedAlpha:true});
    glr.setPixelRatio(1);glr.outputColorSpace=THREE.SRGBColorSpace;glr.setClearColor(0,0);
    scene=new THREE.Scene();cam=new THREE.OrthographicCamera(0,w,0,-h,.1,8000);cam.position.z=4000;
    root=new THREE.Group();scene.add(root);
  }
  if(glr.domElement.width!==w||glr.domElement.height!==h){glr.setSize(w,h,false);cam.right=w;cam.bottom=-h;cam.updateProjectionMatrix()}
}
function drawGlasses(p){
  const f=FR[cur];if(!f.cv)return;
  if(THREE&&p.f){
    try{
      ensureGL(cv.width,cv.height);
      if(rigFor!==f||!rig)buildRig(f);
      const F=p.f;root.quaternion.set(F.q[0],F.q[1],F.q[2],F.q[3]);root.position.set(F.t[0],F.t[1],F.t[2]);root.scale.setScalar(F.s);
      glr.render(scene,cam);
      ctx.save();ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=F.s*.35;ctx.shadowOffsetY=F.s*.2;
      ctx.drawImage(glr.domElement,0,0,cv.width,cv.height);ctx.restore();
      return;
    }catch(e){console.log('GLFAIL',e&&e.message,e&&e.stack&&e.stack.slice(0,300));THREE=null}
  }
  const q=p.p2,w=q.w*1.02,h=w*f.cv.height/f.cv.width;
  ctx.save();ctx.translate(q.cx,q.cy+q.w*.015);ctx.rotate(q.roll);ctx.scale(q.sx,1);
  ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=w*.02;ctx.shadowOffsetY=w*.012;
  ctx.drawImage(f.cv,-w/2,-h/2,w,h);ctx.restore();
}
function redraw(){
  if(mode==='photo'&&photoImg){ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(photoImg,0,0,cv.width,cv.height);if(lastFace){drawGlasses(lastFace);badge.hidden=true}else{badge.textContent=T.noface;badge.hidden=false}}
}
function setMode(m){mode=m;if(m!=='cam'&&stream){stream.getTracks().forEach(t=>t.stop());stream=null;cancelAnimationFrame(raf)}$('bCam').textContent=m==='cam'?T.stop:T.cam}

$('bCam').onclick=async()=>{
  if(mode==='cam'){setMode('none');showHint(T.h1,T.h2);return}
  spinHint(T.loading);
  try{
    const [L]=await Promise.all([tracker(),loadThree(),navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false}).then(s=>stream=s)]);
    video=document.createElement('video');video.playsInline=true;video.muted=true;video.srcObject=stream;await video.play();
    await L.setOptions({runningMode:'VIDEO'});
    cv.width=video.videoWidth||960;cv.height=video.videoHeight||720;setMode('cam');sm=null;lastFace=null;hint.hidden=true;
    let lastT=-1,miss=0;
    const loop=()=>{
      if(mode!=='cam')return;
      const t=performance.now();
      if(video.readyState>=2&&t!==lastT){
        lastT=t;ctx.save();ctx.translate(cv.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,cv.width,cv.height);ctx.restore();
        const r=L.detectForVideo(video,t);
        if(r.faceLandmarks&&r.faceLandmarks[0]){miss=0;lastFace=smooth(pose(r.faceLandmarks[0],cv.width,cv.height,true));badge.hidden=true}
        else if(++miss>12){lastFace=null;sm=null;badge.textContent=T.noface;badge.hidden=false}
        if(lastFace)drawGlasses(lastFace);
      }
      raf=requestAnimationFrame(loop);
    };
    loop();
  }catch(e){setMode('none');showHint(T.h1,T.camfail)}
};
$('bPhoto').onclick=()=>$('file').click();
$('file').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  setMode('photo');spinHint(T.loading);
  try{
    const L=await tracker();await L.setOptions({runningMode:'IMAGE'});
    const url=URL.createObjectURL(f);const im=await load(url);
    const sc=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight));cv.width=Math.round(im.naturalWidth*sc);cv.height=Math.round(im.naturalHeight*sc);
    photoImg=im;hint.hidden=true;
    const r=L.detect(im);
    await loadThree();sm=null;lastFace=(r.faceLandmarks&&r.faceLandmarks[0])?smooth(pose(r.faceLandmarks[0],cv.width,cv.height,false)):null;
    redraw();
  }catch(e){showHint(T.h1,T.camfail)}
  ev.target.value='';
};
window.__tryon={dbg:()=>({rig,root,scene,cam,glr,THREE}),FR,select,get face(){return lastFace},async test(img,lm,mir){await loadThree();await Promise.allSettled(FR.map(prep));setMode('photo');cv.width=img.naturalWidth;cv.height=img.naturalHeight;photoImg=img;hint.hidden=true;sm=null;lastFace=smooth(pose(lm,cv.width,cv.height,!!mir));redraw();return lastFace}};
</script>
